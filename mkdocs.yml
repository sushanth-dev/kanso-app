site_name: Chess improvement app
site_description: Architecture decisions, developer guides, and repository policies.
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/index.md
      - 0000 Record architecture decisions: architecture/0000-record-architecture-decisions.md
      - 0001 DTCG 2025.10 token format: architecture/0001-dtcg-2025-10-token-format.md
      - 0002 Commit token sources: architecture/0002-commit-tokens-to-repository.md
      - 0003 Style Dictionary token build: architecture/0003-style-dictionary-token-build.md
      - 0004 Tailwind CSS 4 consumes tokens: architecture/0004-tailwind-4-consumes-tokens.md
      - 0005 Astryx primitives: architecture/0005-astryx-primitives.md
  - Guides:
      - Overview: guides/index.md
      - Local setup: guides/local-setup.md
  - Repository:
      - Contributing: CONTRIBUTING.md
      - Security policy: SECURITY.md
