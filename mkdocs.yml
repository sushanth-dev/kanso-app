site_name: Chess improvement app
site_description: Architecture decisions, developer guides, and repository policies.
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - ADRs:
      - Overview: adrs/index.md
      - Frontend:
          - Records: adrs/frontend/index.md
          - 0000 Record architecture decisions: adrs/frontend/0000-record-architecture-decisions.md
          - 0001 DTCG 2025.10 token format: adrs/frontend/0001-dtcg-2025-10-token-format.md
          - 0002 Commit token sources: adrs/frontend/0002-commit-tokens-to-repository.md
          - 0003 Style Dictionary token build: adrs/frontend/0003-style-dictionary-token-build.md
          - 0004 Tailwind CSS 4 consumes tokens: adrs/frontend/0004-tailwind-4-consumes-tokens.md
          - 0005 Astryx primitives: adrs/frontend/0005-astryx-primitives.md
          - 0006 D3 for data visualization: adrs/frontend/0006-d3-visualizations.md
          - 0017 Canvas UI decorative motion: adrs/frontend/0017-canvas-ui-effects.md
      - Backend:
          - Records: adrs/backend/index.md
          - 0007 Hono HTTP framework: adrs/backend/0007-hono-http-framework.md
          - 0008 Zod validation: adrs/backend/0008-zod-validation.md
          - 0009 Drizzle ORM: adrs/backend/0009-drizzle-orm.md
          - 0010 chess.js, PGN and FEN storage: adrs/backend/0010-chess-js-pgn-game-logic.md
          - 0011 better-auth sessions: adrs/backend/0011-better-auth-session-management.md
          - 0012 Stockfish WASM and pg-boss: adrs/backend/0012-pg-boss-stockfish-analysis.md
          - 0013 REST with OpenAPI contract: adrs/backend/0013-rest-openapi-api-contract.md
          - 0014 AWS hosting layout: adrs/backend/0014-aws-hosting-layout.md
          - 0015 SST infrastructure as code: adrs/backend/0015-sst-infrastructure-as-code.md
          - 0016 SSE analysis result delivery: adrs/backend/0016-sse-analysis-result-delivery.md
          - 0018 AI explanation layer: adrs/backend/0018-ai-explanation-layer.md
          - 0019 Vitest testing setup: adrs/backend/0019-vitest-testing-setup.md
          - 0020 Node.js 24 LTS runtime: adrs/backend/0020-node-24-lts-runtime.md
          - 0021 postgres.js driver: adrs/backend/0021-postgres-js-driver.md
          - 0022 PostgreSQL 18: adrs/backend/0022-postgresql-18.md
          - 0023 Native Stockfish in Lambda: adrs/backend/0023-stockfish-native-lambda-depth-21.md
  - Guides:
      - Overview: guides/index.md
      - Local setup: guides/local-setup.md
      - AWS account setup: guides/aws-account-setup.md
      - Deploying to AWS: guides/deploy.md
  - Repository:
      - Contributing: CONTRIBUTING.md
      - Security policy: SECURITY.md
