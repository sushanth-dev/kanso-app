name: CI

# The gates that count. The pre-commit hook runs the same checks locally for
# fast feedback, but this is the version that cannot be skipped and runs in a
# clean environment. A red run blocks the merge.
#
# The working agreements are in the `project` repository, under
# docs/process/code-quality.md, docs/process/testing.md, and
# docs/process/security.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Reads .node-version, so CI and a laptop cannot disagree about the
          # runtime (ADR-0020).
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Format
        run: npx prettier --check .

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      - name: Contract is generated, not hand-edited
        # openapi.json is generated from the route definitions and committed so
        # a reviewer can see what a contract change does. If regenerating it
        # produces a diff, someone edited the output instead of the source.
        run: |
          npm run openapi
          git diff --exit-code -- apps/api/openapi.json

      - name: Tests
        run: npm run test:coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Dependency audit
        # docs/process/security.md: high or critical findings block the merge.
        run: npm audit --audit-level=high

  integration:
    # The integration suite runs against a real PostgreSQL and a real SQS
    # because the testing policy forbids mocking either. The service container
    # versions are pinned by ADR-0022 and must match docs/guides/local-setup.md.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanso_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      localstack:
        image: localstack/localstack:4
        env:
          SERVICES: sqs
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanso_dev
      # A fixed test value, not a real credential: it signs session cookies in
      # the throwaway test database the suite creates and drops. The production
      # secret comes from the environment at deploy time and never appears
      # here.
      BETTER_AUTH_SECRET: ci-test-secret-for-the-integration-suite-0123456789abcdef
      # LocalStack takes any credentials; the SDK refuses to send without them.
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Integration tests
        run: npm run test:integration

  semgrep:
    # Split out because it pulls its own toolchain and rulesets, and a slow
    # security scan should not sit in front of a fast lint failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # There is no Python dependency file here to key a cache on, and uv
          # warns on every run when it looks for one. Semgrep comes from uvx
          # rather than from a lockfile, so there is nothing to cache anyway.
          enable-cache: false

      - name: Semgrep
        # p/default is the community ruleset and the only one of the obvious
        # candidates that actually fires. p/typescript loads 74 rules and
        # caught nothing on a file containing eval(); p/default loads over a
        # thousand and caught it. Verified by running both against a file
        # written to fail. Hardcoded credentials are the gap it leaves, and
        # the secrets job below is what covers them.
        run: uvx semgrep --error --metrics=off --config p/default .

  secrets:
    # The local hook scans staged content, which cannot see a secret that was
    # committed before the hook existed or on a machine without it. This scans
    # the whole history, which is the version that counts.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Zero means the full history. The default is a shallow clone, which
          # would scan the tip and report clean on a repository with a
          # credential three commits back.
          fetch-depth: 0

      - name: Install gitleaks
        # Installed from the pinned release and checksummed rather than through
        # a third-party action, so the only trust here is in a tarball whose
        # hash is in this file. docs/process/security.md wants dependencies
        # pinned; this is what that means for a binary.
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Secret scan
        run: ./gitleaks git --no-banner --redact .
